; OhMyMods Mac ARM64 最小默认 BepInEx 配置（仅当 BepInEx/config/BepInEx.cfg 缺失时播种，
; 既有配置永不覆盖；loader 关键键不兼容时启动器会明确拒绝并说明）。
; 有效值与实验室验证布局一致；只保留实际接线的键（[Logging.Disk] 为真实段名，
; 未列出的键由 BepInEx 按内置默认补齐）。

[Caching]
EnableAssemblyCache = true

[Detours]
DetourProviderType = Default

[IL2CPP]
UpdateInteropAssemblies = true
UnityBaseLibrariesSource = https://unity.bepinex.dev/libraries/{VERSION}.zip
ScanMethodRefs = false
DumpDummyAssemblies = false
IL2CPPInteropAssembliesPath = {BepInEx}
PreloadIL2CPPInteropAssemblies = true
GlobalMetadataPath = {GameDataPath}/il2cpp_data/Metadata/global-metadata.dat

[Logging]
UnityLogListening = false

[Logging.Console]
Enabled = true
StandardOutType = Auto
ForceBepInExTTYDriver = false

[Logging.Disk]
Enabled = true
