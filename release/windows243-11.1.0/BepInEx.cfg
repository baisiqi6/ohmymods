# OhMyMods Windows 2.4.3 loader configuration.
# Only the four IL2CPP keys required by the frozen generated bindings are pinned.
# All other BepInEx settings use loader defaults on first run.

[IL2CPP]
UpdateInteropAssemblies = false
UnityBaseLibrariesSource = 6000.0.66.zip
IL2CPPInteropAssembliesPath = {BepInEx}
GlobalMetadataPath = {GameDataPath}/il2cpp_data/Metadata/global-metadata.dat
